# Publishes site/ (the home page and the shared menu) to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# This repo is named mettpp.github.io, so the site is the root of https://mettpp.github.io/, and the
# RE-screening and RE-jkt Pages sites appear under it at /RE-screening/ and /RE-jkt/.
name: Deploy home page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
